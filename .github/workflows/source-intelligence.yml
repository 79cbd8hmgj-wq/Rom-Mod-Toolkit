name: Source intelligence verification

on:
  push:
    branches:
      - 'feature/nds-source-intelligence'
  workflow_dispatch:

jobs:
  source-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolkit
        run: python -m pip install -e '.[test]'

      - name: Compile source-intelligence code and tests
        run: |
          python -m compileall -q src/rommod tests/analysis tests/domains
          for path in tests/test_cli_source_*.py tests/integration/test_source_intelligence_*.py; do
            test -f "$path" && python -m compileall -q "$path"
          done

      - name: Run source-intelligence tests
        run: |
          paths=()
          test -d tests/analysis && paths+=(tests/analysis)
          test -d tests/domains && paths+=(tests/domains)
          for path in tests/test_cli_source_*.py tests/integration/test_source_intelligence_*.py; do
            test -f "$path" && paths+=("$path")
          done
          pytest -q "${paths[@]}"
