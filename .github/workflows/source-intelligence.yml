name: Source intelligence verification

on:
  push:
    branches:
      - 'feature/nds-source-intelligence'
  workflow_dispatch:

jobs:
  source-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolkit
        run: python -m pip install -e '.[test]'

      - name: Compile source-intelligence code and tests
        run: |
          python -m compileall -q src/rommod tests/analysis tests/domains tests/test_cli_source_intelligence.py tests/integration/test_source_intelligence_c3d2.py 2>/dev/null || \
          python -m compileall -q src/rommod tests/analysis

      - name: Run source-intelligence tests
        run: |
          paths=()
          test -d tests/analysis && paths+=(tests/analysis)
          test -d tests/domains && paths+=(tests/domains)
          test -f tests/test_cli_source_intelligence.py && paths+=(tests/test_cli_source_intelligence.py)
          test -f tests/integration/test_source_intelligence_c3d2.py && paths+=(tests/integration/test_source_intelligence_c3d2.py)
          pytest -q "${paths[@]}"
